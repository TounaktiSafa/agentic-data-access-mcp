- id: q29
  category: join
  question: "How many orders were placed by customers in Germany (DE)?"
  gold_sql: "SELECT COUNT(*) FROM analytics.orders o JOIN analytics.customers c ON o.customer_id = c.customer_id WHERE c.country = 'DE'"
