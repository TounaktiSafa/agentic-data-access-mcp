- id: q19
  category: metric
  question: "What was our revenue in 2024?"
  gold_sql: "SELECT SUM(oi.quantity * p.price) FROM analytics.order_items oi JOIN analytics.orders o ON oi.order_id = o.order_id JOIN analytics.products p ON oi.product_id = p.product_id WHERE o.status = 'completed' AND EXTRACT(year FROM o.order_date) = 2024"
- id: q20
  category: metric
  question: "What is our revenue from the tech category?"
  gold_sql: "SELECT SUM(oi.quantity * p.price) FROM analytics.order_items oi JOIN analytics.orders o ON oi.order_id = o.order_id JOIN analytics.products p ON oi.product_id = p.product_id WHERE o.status = 'completed' AND p.category = 'tech'"
