# 40 business questions. category: count | filter | aggregate | groupby | join | metric
- id: q01
  category: count
  question: "How many customers do we have?"
  gold_sql: "SELECT COUNT(*) FROM analytics.customers"
- id: q02
  category: count
  question: "How many products do we sell?"
  gold_sql: "SELECT COUNT(*) FROM analytics.products"
- id: q03
  category: count
  question: "How many orders have been placed in total?"
