- id: q37
  category: metric
  question: "What is our total revenue?"
  gold_sql: "SELECT SUM(oi.quantity * p.price) FROM analytics.order_items oi JOIN analytics.orders o ON oi.order_id = o.order_id JOIN analytics.products p ON oi.product_id = p.product_id WHERE o.status = 'completed'"
- id: q38
  category: metric
  question: "What is our average order value?"
  gold_sql: "SELECT SUM(oi.quantity * p.price) / COUNT(DISTINCT o.order_id) FROM analytics.order_items oi JOIN analytics.orders o ON oi.order_id = o.order_id JOIN analytics.products p ON oi.product_id = p.product_id WHERE o.status = 'completed'"
- id: q39
  category: metric
  question: "What is our revenue per product category?"
  gold_sql: "SELECT p.category, SUM(oi.quantity * p.price) FROM analytics.order_items oi JOIN analytics.orders o ON oi.order_id = o.order_id JOIN analytics.products p ON oi.product_id = p.product_id WHERE o.status = 'completed' GROUP BY p.category"
- id: q40
  category: metric
  question: "What is our revenue per customer country?"
  gold_sql: "SELECT c.country, SUM(oi.quantity * p.price) FROM analytics.order_items oi JOIN analytics.orders o ON oi.order_id = o.order_id JOIN analytics.products p ON oi.product_id = p.product_id JOIN analytics.customers c ON o.customer_id = c.customer_id WHERE o.status = 'completed' GROUP BY c.country"
