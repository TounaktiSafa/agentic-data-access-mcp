- id: q34
  category: aggregate
  question: "What is the name of our most expensive product?"
  gold_sql: "SELECT product_name FROM analytics.products ORDER BY price DESC LIMIT 1"
- id: q35
  category: join
  question: "How many order lines belong to cancelled orders?"
